name: BM101
options:
  bundleIdPrefix: com.bm101
  deploymentTarget:
    iOS: "16.0"

targets:
  BM101:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BM101
    info:
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: []
        NSCameraUsageDescription: "Snug uses your camera to take photos you can save to a Photos album."
        NSPhotoLibraryUsageDescription: "Snug saves photos to a Photos album of your choice and lets you browse it in the app."
        NSPhotoLibraryAddUsageDescription: "Snug saves captured photos to a Photos album of your choice."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bm101.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
