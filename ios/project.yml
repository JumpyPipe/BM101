name: BM101
options:
  bundleIdPrefix: com.bm101
  deploymentTarget:
    iOS: "16.0"

targets:
  BM101:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BM101
    info:
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: []
        NSAppTransportSecurity:
          # Dev-only: the backend runs over plain HTTP on localhost/LAN during
          # development. Tighten this (remove NSAllowsArbitraryLoads, add a
          # proper NSExceptionDomains entry for your real API host) before
          # shipping. See README.md.
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bm101.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
